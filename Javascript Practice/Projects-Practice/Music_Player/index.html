<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="player-container">
        <!-- Song properties -->
        <div id="img-container">
            <img src="./Artist_Pic/Bhaag Milkha Bhaag.jpg" alt="Bhaag Milkha Bhaag">
        </div>
        <div id="artist-container">
            <h2 id="title">Bhaag Milkha Bhaag</h2>
            <h3 id="artist">Shankar Ehsan Loy</h3>
        </div>
        <div id="music-audio">
            <audio src="./Music_Files/Bhaag Milkha Bhaag.mp3" controls></audio>
        </div>

        <div id="buttons">
            <button id="next_track">Next Track Preview (Using API)</button>
        </div>
            
        

    </div>
    <script src="./index.js"></script>
</body>
</html>
